[project]
name = "google-chat"
version = "0.1.0"
description = "Google Chat messaging"
requires-python = ">=3.11"
# rich: the CLI renders tables directly via rich.table (centaur_sdk no longer
# re-exports Table since upstream #828 removed the cli_tables helpers).
dependencies = ["httpx", "typer>=0.12.0", "rich>=13.0", "python-dotenv>=1.0.0"]

[project.scripts]
google-chat = "centaur_tool_google_chat.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_google_chat"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.centaur]
module = "client.py"
# api-rs is a built-in sandbox capability. iron-proxy injects the principal's
# short-lived Console JWT; Google and internal-service credentials stay server-side.
