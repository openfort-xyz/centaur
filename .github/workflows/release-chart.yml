name: Release Chart

"on":
  pull_request:
    branches:
      - main
    paths:
      - "contrib/chart/**"
      - ".github/workflows/release-chart.yml"
  push:
    branches:
      - main
    paths:
      - "contrib/chart/**"
      - ".github/workflows/release-chart.yml"

permissions: {}

jobs:
  release:
    permissions:
      contents: read
      packages: write
    # ubuntu-latest, not depot-ubuntu-24.04-16: every step here is a lightweight
    # checkout/lint/publish (no compilation), and this job has queued for the
    # full 24h GitHub Actions timeout and been auto-cancelled on every run for
    # the last three weeks without ever picking up a depot runner -- so the
    # chart version-bump check and chart publish silently never ran.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the version-bump check diffs against the merge base.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.1

      - name: Add chart repositories
        run: helm repo add onepassword https://1password.github.io/connect-helm-charts

      - name: Build chart dependencies
        run: helm dependency build contrib/chart

      - name: Lint chart
        run: helm lint contrib/chart

      - name: Install yq
        uses: mikefarah/yq@1b9b4ac5187171d2e5e3129be0cfa827c7f9d53d # v4.53.3

      - name: Validate chart version bump
        run: |
          set -e

          CHART_YAML="contrib/chart/Chart.yaml"

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            BASE_REF="origin/${GITHUB_BASE_REF}"
            CHANGED_FILES=$(git diff --name-only "${BASE_REF}...HEAD" 2>/dev/null || echo "")
            PREVIOUS_VERSION=$(git show "${BASE_REF}:${CHART_YAML}" 2>/dev/null | yq '.version' 2>/dev/null || echo "")
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            PREVIOUS_VERSION=$(git show HEAD~1:"$CHART_YAML" 2>/dev/null | yq '.version' 2>/dev/null || echo "")
          fi

          if ! echo "$CHANGED_FILES" | grep -q "^contrib/chart/"; then
            echo "No chart changes detected"
            exit 0
          fi

          CURRENT_VERSION=$(yq '.version' "$CHART_YAML")

          if [ -n "$PREVIOUS_VERSION" ] && [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "Version already bumped ($PREVIOUS_VERSION -> $CURRENT_VERSION)"
            exit 0
          fi

          echo "::error file=${CHART_YAML}::contrib/chart changed but chart version stayed at ${CURRENT_VERSION}. Bump .version in the PR."
          exit 1

      # Published as an OCI artifact into the same ghcr.io namespace as the six
      # fleet images, rather than as a GitHub release asset indexed on gh-pages.
      #
      # chart-releaser cannot publish here: this org enables GitHub's immutable
      # releases, and cr creates the release *before* uploading the .tgz, so the
      # upload always fails with "422 Cannot upload assets to an immutable
      # release" (helm/chart-releaser-action#228). The upstream fix for that is
      # still unmerged (helm/chart-releaser#587) and is in no released cr
      # version, so this was not a version bump away. OCI sidesteps GitHub
      # Releases entirely and keeps release immutability switched on.
      #
      # This is the *distribution* copy only. Argo does not consume it: the
      # op-helm CMP clones the fork at the pinned SHA and templates
      # contrib/chart straight from the git tree.
      - name: Package chart
        if: github.event_name == 'push'
        run: helm package contrib/chart --destination .chart-packages

      - name: Publish chart to ghcr.io
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Exactly one package is expected. A glob matching several would
          # otherwise push an arbitrary one and still report success.
          shopt -s nullglob
          packages=(.chart-packages/*.tgz)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::expected exactly 1 packaged chart, found ${#packages[@]}"
            exit 1
          fi

          # ghcr.io rejects uppercase path segments; owners may not be lowercase.
          repo=$(echo "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')

          echo "${GH_TOKEN}" | helm registry login ghcr.io \
            --username "${ACTOR}" --password-stdin
          helm push "${packages[0]}" "oci://ghcr.io/${repo}/charts"
